<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
 /* The callout engine. 1080x1920, 30fps, loops.
    One template, N decks in reel-callout.json. A hook, then a run of filed
    cards on hard cuts, then a comment prompt. Same rules as reels 02, 04, 09:
    render(f) is a pure function of the frame, no CSS transitions, no fades,
    Tota bobs 4px on a 30 frame cycle. */
 :root{--bg:#FBF3E0;--dot:#E8DCC2;--stock:#F4EEDD;--ink:#1E3A2A;--cream:#FBF3E0;
       --marigold:#FFD24A;--muted:#5E6E5E;--mint:#DFF2E4;--pink:#F8D3E0;--pink-ink:#C2588A;
       --parrot:#178A4C}
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#111;font-family:'Bricolage Grotesque',sans-serif}
 #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);
   background-image:radial-gradient(var(--dot) 3px,transparent 3.5px);background-size:50px 50px}

 .masthead{position:absolute;left:48px;top:120px;width:984px;height:140px;background:var(--ink);
   display:flex;align-items:center;justify-content:center;box-shadow:14px 14px 0 rgba(30,58,42,.28)}
 .masthead span{color:var(--cream);font-weight:800;font-size:54px;letter-spacing:.16em;text-transform:uppercase}
 #deskbar{position:absolute;left:48px;top:268px;width:984px;height:66px;overflow:hidden}
 #deskbar .fill{position:absolute;inset:0;background:var(--marigold);border:6px solid var(--ink);
   display:flex;align-items:center;justify-content:center;transform-origin:left center}
 #deskbar b{font-weight:800;font-size:30px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);white-space:nowrap}

 /* the hook, frames 14 to the first cut */
 .hd{position:absolute;left:72px;width:936px;top:660px}
 .l{font-weight:800;line-height:1.02;letter-spacing:-.035em;text-transform:lowercase;color:var(--ink)}
 #l1{font-size:116px}
 #l2{font-size:96px;margin-top:14px;display:inline-block;padding:2px 26px 10px;border-radius:999px}
 #l3{font-size:42px;font-weight:600;color:var(--muted);margin-top:40px;text-transform:none}

 /* the filed card. two tilted sheets behind it so the run reads as a stack */
 #deck{position:absolute;left:72px;top:430px;width:936px;height:1030px}
 .sheet{position:absolute;inset:0;background:var(--stock);border:8px solid var(--ink)}
 #s2{transform:rotate(-4.2deg);box-shadow:0 10px 0 rgba(30,58,42,.35)}
 #s1{transform:rotate(2.8deg);box-shadow:0 10px 0 rgba(30,58,42,.35)}
 #card{position:absolute;inset:0;background:var(--cream);border:8px solid var(--ink);
   box-shadow:0 16px 0 var(--ink);padding:56px 56px 0;transform-origin:50% 40%}
 #ctag{display:inline-block;background:var(--marigold);border:7px solid var(--ink);border-radius:999px;
   padding:10px 38px 18px;font-weight:800;font-size:66px;letter-spacing:-.02em;text-transform:lowercase;
   color:var(--ink);box-shadow:0 8px 0 var(--ink)}
 #ctag.alt{background:var(--pink)}
 #bubble{position:relative;margin-top:64px;background:var(--stock);border:8px solid var(--ink);
   border-radius:44px;padding:44px 48px;box-shadow:0 10px 0 var(--ink)}
 #bubble:after{content:"";position:absolute;left:62px;bottom:-40px;width:0;height:0;
   border:20px solid transparent;border-top-color:var(--ink);border-bottom:0}
 #btext{font-weight:800;font-size:72px;line-height:1.1;letter-spacing:-.03em;color:var(--ink);text-wrap:balance}
 #csub{margin-top:76px;font-weight:600;font-size:46px;line-height:1.22;color:var(--muted);text-wrap:balance}
 #cmeta{position:absolute;left:56px;right:56px;bottom:40px;display:flex;justify-content:space-between;
   border-top:5px solid var(--ink);padding-top:20px;font-weight:800;font-size:28px;letter-spacing:.2em;
   text-transform:uppercase;color:var(--muted)}

 /* the closer */
 #cta{position:absolute;left:72px;top:430px;width:936px;height:1030px;background:var(--ink);
   border:8px solid var(--ink);box-shadow:0 16px 0 rgba(30,58,42,.3);padding:96px 72px;
   display:flex;flex-direction:column;justify-content:center}
 #cta h2{color:var(--cream);font-weight:800;font-size:118px;line-height:1.14;letter-spacing:-.04em;
   text-transform:lowercase;text-wrap:balance}
 #cta h2 em{font-style:normal;background:var(--marigold);color:var(--ink);padding:0 20px 10px;border-radius:999px}
 #cta p{margin-top:56px;color:#BFD6C4;font-weight:600;font-size:50px;line-height:1.24}
 #ctapill{margin-top:76px;align-self:flex-start;background:var(--marigold);border:8px solid var(--cream);
   border-radius:999px;padding:18px 54px 26px;font-weight:800;font-size:60px;color:var(--ink)}
 #stamp{position:absolute;right:56px;bottom:56px;background:var(--pink-ink);color:var(--cream);
   font-weight:800;font-size:34px;letter-spacing:.2em;text-transform:uppercase;padding:14px 26px 20px;
   transform:rotate(-7deg)}

 .sub{position:absolute;left:72px;top:1520px;width:660px;font-weight:600;font-size:44px;line-height:1.24;color:var(--muted)}
 #tota{position:absolute;right:20px;bottom:112px;width:330px}
 .foot{position:absolute;left:72px;bottom:92px;font-weight:800;font-size:46px;letter-spacing:.14em;
   text-transform:uppercase;color:var(--ink)}
 .hidden{visibility:hidden}
</style></head><body>
<div id="stage">
  <div class="masthead" id="mast"><span>the daily tota</span></div>
  <div id="deskbar"><div class="fill" id="deskfill"><b id="deskkick"></b></div></div>

  <div class="hd" id="head">
    <div class="l" id="l1"></div>
    <div class="l" id="l2"></div>
    <div class="l" id="l3"></div>
  </div>

  <div id="deck">
    <div class="sheet" id="s2"></div>
    <div class="sheet" id="s1"></div>
    <div id="card">
      <div id="ctag"></div>
      <div id="bubble"><div id="btext"></div></div>
      <div id="csub"></div>
      <div id="cmeta"><span id="mno"></span><span id="mwhen"></span></div>
    </div>
  </div>

  <div id="cta">
    <h2></h2>
    <p></p>
    <div id="ctapill"></div>
    <div id="stamp">ask tota</div>
  </div>

  <div class="sub" id="sub"></div>
  <img id="tota" src="tota.png" alt="">
  <div class="foot" id="foot">asktota.com</div>
</div>
<script>
const $=id=>document.getElementById(id),
      cl=(v,a,b)=>Math.max(a,Math.min(b,v)),
      p=(f,a,b)=>cl((f-a)/(b-a),0,1);

// timeline constants. the deck decides how many cards, everything else is fixed.
const T={mast:0, desk:8, l1:14, l2:24, l3:34, first:54};
let D=null, TOTAL=0, SFX=[], CUTS=[];

function setDeck(deck){
  D=deck;
  const hold=deck.hold||24, n=deck.cards.length;
  CUTS=deck.cards.map((_,i)=>T.first+i*hold);
  const ctaAt=T.first+n*hold;
  TOTAL=ctaAt+(deck.ctaHold||54);

  $('deskkick').innerHTML=deck.kicker;
  // the bar clips rather than wraps, so shrink a long kicker until it fits
  const kick=$('deskkick');
  kick.style.fontSize=''; kick.style.letterSpacing='';
  for(let px=29; px>17 && kick.scrollWidth>944; px--){
    kick.style.fontSize=px+'px';
    kick.style.letterSpacing=(0.24-(29-px)*0.012)+'em';
  }
  $('l1').textContent=deck.hook[0];
  $('l2').textContent=deck.hook[1];
  $('l3').textContent=deck.hook[2]||'';
  $('sub').textContent=deck.sub||'';
  $('cta').querySelector('h2').innerHTML=deck.cta.h.replace(/\*\*(.+?)\*\*/g,'<em>$1</em>');
  $('cta').querySelector('p').textContent=deck.cta.p;
  $('ctapill').textContent=deck.cta.btn;

  // every sound sits on the exact frame the thing happens, so timing cannot
  // drift from the animation it belongs to.
  SFX=[['thud',T.mast,0.9],['whoosh',T.desk,0.5],['click',T.l1,0.5],['click',T.l2,0.6]]
      .concat(CUTS.flatMap((c,i)=>[['whoosh',c,0.55],['click',c+3,i===0?0.7:0.5]]))
      .concat([['thud',ctaAt,0.95],['stamp',ctaAt+8,1.0]]);
  window.TOTAL=TOTAL; window.SFX=SFX; window.CTA_AT=ctaAt;
  return {total:TOTAL, sfx:SFX};
}

function paint(i){
  const c=D.cards[i];
  $('ctag').textContent=c.tag;
  $('ctag').classList.toggle('alt', !!c.alt);
  $('btext').textContent=c.line;
  $('csub').textContent=c.sub||'';
  $('mno').textContent=`no. ${String(i+1).padStart(2,'0')} / ${String(D.cards.length).padStart(2,'0')}`;
  $('mwhen').textContent=c.when||D.when||'filed';
}

function render(f){
  const ctaAt=window.CTA_AT;
  // masthead drops in and settles, then the desk bar wipes across
  const my = f<4 ? -300+304*p(f,0,3) : (f<7 ? 4-4*p(f,4,6) : 0);
  $('mast').style.transform=`translateY(${my}px)`;
  $('deskbar').classList.toggle('hidden', f<T.desk);
  $('deskfill').style.transform=`scaleX(${p(f,T.desk,T.desk+5)})`;

  const onCards = f>=T.first;
  $('head').classList.toggle('hidden', onCards);
  $('l1').classList.toggle('hidden', f<T.l1);
  $('l2').classList.toggle('hidden', f<T.l2);
  $('l3').classList.toggle('hidden', f<T.l3);
  $('l2').style.background = f<T.l2 ? 'transparent' : 'var(--marigold)';

  const onCta = f>=ctaAt;
  $('deck').classList.toggle('hidden', !onCards || onCta);
  $('cta').classList.toggle('hidden', !onCta);

  if(onCards && !onCta){
    let i=0; for(let k=0;k<CUTS.length;k++) if(f>=CUTS[k]) i=k;
    paint(i);
    // three frame slam on each cut, then dead still. paper-cut, not easing.
    const s=1+0.045*(1-p(f,CUTS[i],CUTS[i]+3));
    $('card').style.transform=`scale(${s})`;
    $('s1').classList.toggle('hidden', i<1);
    $('s2').classList.toggle('hidden', i<2);
  }
  if(onCta){
    const s=1+0.05*(1-p(f,ctaAt,ctaAt+3));
    $('cta').style.transform=`scale(${s})`;
    $('stamp').classList.toggle('hidden', f<ctaAt+8);
  }

  // tota bobs 4px, always
  $('tota').style.transform=`translateY(${Math.round(2*Math.sin(f/30*2*Math.PI))*2}px)`;
  $('sub').classList.toggle('hidden', f<T.first);
}
window.setDeck=setDeck; window.render=render;
</script>
</body></html>
