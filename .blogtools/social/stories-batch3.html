<script>
// The card is fixed width, so shrink the type until the longest line fits,
// then re-centre the block on the original three-line baseline.
document.fonts.ready.then(() => {
  document.querySelectorAll('.hd').forEach(hd => {
    let size = 96;
    const lines = [...hd.querySelectorAll('.line')];
    const fit = () => {
      lines.forEach(l => { l.style.fontSize = size + 'px'; l.style.lineHeight = Math.round(size*1.323) + 'px'; });
      return Math.max(...lines.map(l => l.firstChild.getBoundingClientRect().width));
    };
    while (fit() > 800 && size > 58) size -= 2;
    const lh = Math.round(size * 1.323);
    hd.style.top = (Number(hd.dataset.top) + (127 - lh) * (lines.length - 1) / 2) + 'px';
  });
  document.body.dataset.ready = '1';
});
</script>
